<div id="wb-staff-wrap" style="background:#0F0F11;min-height:600px;">
<iframe id="wb-staff-portal" title="Staff links portal" style="width:100%;height:1500px;min-height:600px;border:0;background:#0F0F11;display:block;"></iframe>
<noscript>JavaScript is required to view the staff links.</noscript>
</div>
<script>
(function(){
var URL_="https://cdn.jsdelivr.net/gh/Becca-Rose/wigbox-staff-portal@main/index.html";
var f=document.getElementById("wb-staff-portal");
fetch(URL_).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(h){
f.src=URL.createObjectURL(new Blob([h],{type:"text/html"}));
}).catch(function(){
var m=document.createElement("div");
m.setAttribute("dir","rtl");
m.style.cssText="color:#fff;text-align:center;padding:40px;font-family:sans-serif";
m.textContent="לא הצלחנו לטעון את הדף. נסו לרענן.";
f.parentNode.appendChild(m);
});
var q=0;
function sendView(){
q=0;
if(!f.contentWindow)return;
var r=f.getBoundingClientRect();
var vb=Math.max(0,Math.min(window.innerHeight,r.bottom)-r.top);
f.contentWindow.postMessage({wbVisibleBottom:vb},"*");
}
function queueView(){if(!q)q=requestAnimationFrame(sendView)}
window.addEventListener("scroll",queueView,{passive:true});
window.addEventListener("resize",queueView);
window.addEventListener("message",function(e){
var d=e.data;
if(e.source!==f.contentWindow||!d)return;
if(d.wbPortalH){f.style.height=d.wbPortalH+"px";queueView()}
if(d.wbReady){queueView()}
});
})();
</script>
